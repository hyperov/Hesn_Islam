plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
}


def apiKeyPropertiesFile = rootProject.file("apikey.properties")
def apiKeyProperties = new Properties()
apiKeyProperties.load(new FileInputStream(apiKeyPropertiesFile))

android {

    namespace "com.islam.hesn.myapplication"
    signingConfigs {

        release {
            storeFile file("hesn_islam_key_store.jks")
            storePassword '0109904219'
            keyAlias 'key_hesn_islam'
            keyPassword '0109904219'
        }

    }

    compileSdk 34

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.islam.hesn.myapplication"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 15
        versionName "2.55"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "YOUTUBE_API_KEY", apiKeyProperties['YOUTUBE_API_KEY'])
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    buildTypes {
        debug {
            manifestPlaceholders = [crashlyticsCollectionEnabled: "false"]
            ext.enableCrashlytics = false
        }
        release {
            minifyEnabled true
            shrinkResources false
            ext.enableCrashlytics = true
            signingConfig signingConfigs.release
            manifestPlaceholders = [crashlyticsCollectionEnabled: "true"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*'
        exclude("META-INF/*.kotlin_module")
    }
}

dependencies {

    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-perf-ktx'

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    testImplementation 'androidx.test.ext:junit-ktx:1.2.1'

    def paging_version = '3.3.1'

    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'

    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.7"

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'com.google.code.gson:gson:2.9.0'

    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.9.1"
//    implementation 'com.squareup.retrofit2:converter-scalars:2.1.0'

    implementation 'com.google.dagger:hilt-android:2.44'
    kapt 'com.google.dagger:hilt-compiler:2.44'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

    //view model , life cycle
//    implementation "android.arch.lifecycle:extensions:1.1.1"
    implementation "androidx.arch.core:core-common:2.2.0"


    //viewmodel with hilt
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    //coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    //coroutines viewmodel scope
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4"
    //coroutines lifecycle scope
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"

    //paging 3 lib
    implementation "androidx.paging:paging-runtime-ktx:$paging_version"

    implementation('com.google.api-client:google-api-client-android:1.33.2') {
        exclude group: 'org.apache.httpcomponents'
    }

    implementation "com.thoughtbot:expandablerecyclerview:1.4"

    implementation 'com.github.bumptech.glide:glide:4.15.1'

    implementation 'com.airbnb.android:lottie:4.2.2'

    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:10.0.5'

    implementation 'androidx.preference:preference-ktx:1.2.1'


    //review
    implementation 'com.google.android.play:review:2.0.1'
    // For Kotlin users, also add the Kotlin extensions library for Play In-App Review:
    implementation 'com.google.android.play:review-ktx:2.0.1'

    //update
    implementation 'com.google.android.play:app-update:2.1.0'
    // For Kotlin users, also add the Kotlin extensions library for Play In-App Update:
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3'


}

kapt {
    correctErrorTypes = true
}