[versions]
# Android
androidGradlePlugin = "8.13.0"
compileSdk = "36"
targetSdk = "36"
minSdk = "23"

# Kotlin
kotlin = "2.2.20"
ksp = "2.2.20-2.0.2"

# AndroidX
androidxCore = "1.17.0"
androidxAppcompat = "1.7.1"
androidxConstraintlayout = "2.2.1"
androidxRecyclerview = "1.4.0"
androidxLegacySupport = "1.0.0"
androidxLifecycle = "2.9.4"
androidxLifecycleExtensions = "2.2.0"
androidxArchCore = "2.2.0"
androidxNavigation = "2.9.5"
androidxPaging = "3.3.6"
androidxPreference = "1.2.1"
fragmentVersion = "1.8.9"

# Google
material = "1.13.0"
firebase = "34.4.0"
googleServices = "4.4.4"
crashlytics = "3.0.6"
firebasePerf = "2.0.1"
gson = "2.13.2"
googleApiClient = "2.8.1"
playAppUpdate = "2.1.0"
playReview = "2.0.2"

# Hilt
hilt = "2.57.2"
hiltCompiler = "1.3.0"

# Retrofit & OkHttp
retrofit = "3.0.0"
okhttp = "5.2.1"

# Coroutines
coroutines = "1.10.2"

# Testing
junit = "1.3.0"
espressoCore = "3.5.1"

# Compose
compose = "2025.10.00"
composeViewModel = "2.9.4"
composeFragment = "1.8.1"
composeNavigation = "2.9.6"

# Other
expandableRecyclerview = "v1.4"
glide = "5.0.5"
lottie = "6.7.1"
youtubeplayer = "13.0.0"
pdfViewer = "3.2.7"
navigationFragmentKtx = "2.9.6"
navigationUiKtx = "2.9.6"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidxRecyclerview" }
androidx-legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "androidxLegacySupport" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentVersion" }

# Lifecycle
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-extensions = { group = "androidx.lifecycle", name = "lifecycle-extensions", version.ref = "androidxLifecycleExtensions" }
androidx-arch-core-common = { group = "androidx.arch.core", name = "core-common", version.ref = "androidxArchCore" }

# Navigation
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidxNavigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidxNavigation" }

# Paging
androidx-paging-runtime-ktx = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "androidxPaging" }

# Preferences
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "androidxPreference" }

# Google
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-perf = { group = "com.google.firebase", name = "firebase-perf" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
google-api-client-android = { group = "com.google.api-client", name = "google-api-client-android", version.ref = "googleApiClient" }
play-app-update = { group = "com.google.android.play", name = "app-update", version.ref = "playAppUpdate" }
play-review = { group = "com.google.android.play", name = "review", version.ref = "playReview" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltCompiler" }

# Retrofit & OkHttp
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"  }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"  }
compose-material = { group = "androidx.compose.material3", name = "material3"  }
compose-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "composeViewModel" }
compose-fragment = { group = "androidx.fragment", name = "fragment-compose", version.ref = "composeFragment" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "composeNavigation" }

# Testing
androidx-test-ext-junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test",name = "runner", version.ref = "junit" }
androidx-test-core = { group = "androidx.test",name = "core", version.ref = "junit" }
androidx-test-espresso = { group = "androidx.test.espresso",name = "espresso-core", version.ref = "espressoCore" }

# Other
expandablerecyclerview = { group = "com.github.thoughtbot.expandable-recycler-view", name = "expandablerecyclerview", version.ref = "expandableRecyclerview" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }
youtubeplayer-core = { group = "com.pierfrancescosoffritti.androidyoutubeplayer", name = "core", version.ref = "youtubeplayer" }
pdfviewer = { group = "com.github.marain87", name = "AndroidPdfViewer", version.ref = "pdfViewer" }
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUiKtx" }

[bundles]
androidx-lifecycle = ["androidx-lifecycle-livedata-ktx", "androidx-lifecycle-viewmodel-ktx", "androidx-lifecycle-runtime-ktx"]
androidx-navigation = ["androidx-navigation-fragment-ktx", "androidx-navigation-ui-ktx"]
retrofit = ["retrofit", "retrofit-converter-gson", "okhttp-logging-interceptor"]
coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
firebase = ["firebase-crashlytics", "firebase-analytics", "firebase-perf"]
compose = [ "compose-ui-tooling-preview", "compose-material", "compose-viewmodel","compose-fragment"]
testing = ["androidx-test-ext-junit-ktx", "androidx-test-runner", "androidx-test-core", "androidx-test-espresso"]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "kotlin-parcelize" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
firebase-perf = { id = "com.google.firebase.firebase-perf", version.ref = "firebasePerf" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
